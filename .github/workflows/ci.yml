name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        server: [veo, nanobanana]

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Offline tests (fake Gemini clients only)
        working-directory: servers/${{ matrix.server }}
        run: env -u GEMINI_API_KEY -u GOOGLE_API_KEY -u GEMINI_API_KEY_BACKUP uv run --locked pytest tests -q

      - name: Lint with ruff correctness rules (hard gate)
        working-directory: servers/${{ matrix.server }}
        # `uv run --with X` creates an ephemeral venv with the project's
        # dependencies plus the named tool, so imports resolve correctly.
        run: uv run --with ruff ruff check --select E4,E7,E9,F .

      - name: Type check with pyright
        working-directory: servers/${{ matrix.server }}
        # 2026-11-05: veo has 0 errors; nanobanana has 62 legacy type errors.
        # Keep only nanobanana nonblocking until its dedicated typing cleanup.
        run: uv run --with pyright pyright .
        continue-on-error: ${{ matrix.server == 'nanobanana' }}

      - name: Build wheel + sdist
        working-directory: servers/${{ matrix.server }}
        run: uv build

      - name: Upload build artifacts
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v5
        with:
          name: dist-${{ matrix.server }}
          path: servers/${{ matrix.server }}/dist/
