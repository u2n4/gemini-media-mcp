name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        server: [omni, nanobanana]

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python-version }}

      - name: Offline tests (fake Gemini clients only)
        working-directory: servers/${{ matrix.server }}
        run: env -u GEMINI_API_KEY -u GOOGLE_API_KEY -u GEMINI_API_KEY_BACKUP uv run --locked pytest tests -q

      - name: Lint with ruff correctness rules (hard gate)
        working-directory: servers/${{ matrix.server }}
        run: uv run --locked ruff check --select E4,E7,E9,F .

      - name: Type check with pyright
        working-directory: servers/${{ matrix.server }}
        # Omni typing is a hard gate; NanoBanana retains a separate legacy typing backlog.
        # Keep only nanobanana nonblocking until its dedicated typing cleanup.
        run: uv run --locked pyright .
        continue-on-error: ${{ matrix.server == 'nanobanana' }}

      - name: Cold uvx startup and tools/list (no credentials)
        run: python scripts/check-stdio.py ${{ matrix.server }} --python ${{ matrix.python-version }}

      - name: Build wheel + sdist
        working-directory: servers/${{ matrix.server }}
        run: uv build

      - name: Upload build artifacts
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.server }}
          path: servers/${{ matrix.server }}/dist/
