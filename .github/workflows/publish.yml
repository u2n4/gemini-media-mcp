# Publish Omni + NanoBanana to PyPI via OIDC Trusted Publisher
#
# Activation requirements (must be done BEFORE first tag push):
#   1. PyPI Trusted Publisher entries registered at:
#        https://pypi.org/manage/project/omni-mcp-server/settings/publishing/
#        https://pypi.org/manage/project/nanobanana-imagen-mcp/settings/publishing/
#      For BOTH:
#        - Owner: u2n4
#        - Repository: gemini-media-mcp
#        - Workflow filename: publish.yml
#        - Environment name: pypi
#   2. GitHub Environment "pypi" created at:
#        https://github.com/u2n4/gemini-media-mcp/settings/environments
#
# Triggers (per sub-package):
#   - tag `omni-v*.*.*`               -> publishes servers/omni
#   - tag `nanobanana-imagen-v*.*.*` -> publishes servers/nanobanana

name: Publish to PyPI

on:
  push:
    tags:
      - "omni-v*.*.*"
      - "nanobanana-imagen-v*.*.*"

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        server: [omni, nanobanana]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Test tagged commit without Gemini credentials
        working-directory: servers/${{ matrix.server }}
        run: env -u GEMINI_API_KEY -u GOOGLE_API_KEY -u GEMINI_API_KEY_BACKUP uv run --locked pytest tests -q

  publish-omni:
    needs: test
    if: startsWith(github.ref, 'refs/tags/omni-v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Build omni
        working-directory: servers/omni
        run: uv build

      - name: Publish omni to PyPI (OIDC)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: servers/omni/dist

  publish-nanobanana:
    needs: test
    if: startsWith(github.ref, 'refs/tags/nanobanana-imagen-v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Build nanobanana
        working-directory: servers/nanobanana
        run: uv build

      - name: Publish nanobanana to PyPI (OIDC)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: servers/nanobanana/dist
