[build-system]
requires = ["hatchling>=1.33.0,<2"]
build-backend = "hatchling.build"

[project]
name = "omni-mcp-server"
version = "2.0.0"
description = "MCP server for video generation using Gemini Omni -- text-to-video and image-to-video"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "u2n4" },
]
keywords = [
    "mcp", "model-context-protocol", "claude", "omni", "gemini",
    "video-generation", "text-to-video", "4k", "ai-video",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "mcp>=2.3.0,<3",
    "google-genai>=2.33.0,<3; python_version < '3.11'",
    "google-genai>=2.34.0,<3; python_version >= '3.11'",
    "httpx>=0.28.1,<1",
    "python-dotenv>=1.2.4,<2",
]

[project.urls]
Homepage = "https://github.com/u2n4/gemini-media-mcp"
Repository = "https://github.com/u2n4/gemini-media-mcp"

[project.scripts]
omni-mcp-server = "omni_mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/omni_mcp_server"]

[dependency-groups]
dev = [
    "pytest>=9.2.0,<10",
    "ruff>=0.17.4,<0.18",
    "pyright>=1.1.414,<2",
]
